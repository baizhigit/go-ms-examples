version: '3'

# Глобальные переменные проекта
vars:
  GO_VERSION: '1.25.3'
  GOLANGCI_LINT_VERSION: 'v2.5.0'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'
  OAPI_CODEGEN_VERSION: 'v2.5.1'
  VACUUM_VERSION: 'v0.23.7'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  OAPI_CODEGEN: '{{.BIN_DIR}}/oapi-codegen'
  VACUUM: '{{.BIN_DIR}}/vacuum'

  OPEN_API_WEATHER_V1_BASE: '{{.ROOT_DIR}}/api/weather/v1/weather.openapi.yaml'
  OPEN_API_WEATHER_V1_BUNDLE: '{{.ROOT_DIR}}/api/bundles/weather.openapi.v1.bundle.yaml'
  OPEN_API_FILES: '{{.ROOT_DIR}}/api'
  OAPI_CODEGEN_WEATHER_V1_TARGET: '{{.ROOT_DIR}}/pkg/openapi/weather/v1'
  OAPI_CODEGEN_WEATHER_V1_PACKAGE: weather_v1

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/baizhigit/go-ms-examples/)" {} +

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  vacuum:install:
    desc: Установить локально vacuum
    cmds:
      - |
        [ -f {{.VACUUM}} ] || {
          echo '📦 Installing vacuum...'
          GOBIN={{.BIN_DIR}} go install github.com/daveshanley/vacuum@{{.VACUUM_VERSION}}
        }
  vacuum:bundle:
    desc: Собрать OpenAPI в один файл через vacuum (resolve $refs)
    deps: [ vacuum:install ]
    cmds:
      - mkdir -p $(dirname {{.OPEN_API_WEATHER_V1_BUNDLE}})
      - |
        echo '📦 Bundling weather v1 API...'
        {{.VACUUM}} bundle -c {{.OPEN_API_WEATHER_V1_BASE}} \
        --base {{.ROOT_DIR}}/api/weather/v1 \
        {{.OPEN_API_WEATHER_V1_BUNDLE}}
        echo '✅ Created: {{.OPEN_API_WEATHER_V1_BUNDLE}}'

  oapi:install:
    desc: "Скачивает oapi-codegen в папку bin"
    cmds:
      - |
        [ -f {{.OAPI_CODEGEN}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
        }

  oapi-codegen:gen:
      desc: "Генерация Go-кода для Weather V1 API"
      deps: [ oapi:install ]
      cmds:
        - rm -rf {{.OAPI_CODEGEN_WEATHER_V1_TARGET}}
        - mkdir -p {{.OAPI_CODEGEN_WEATHER_V1_TARGET}}
        - |
          echo "🚀 Generating Weather V1 API code..."
          {{.OAPI_CODEGEN}} \
            -config {{.ROOT_DIR}}/api/weather/v1/oapi-codegen.config.yaml \
            {{.OPEN_API_WEATHER_V1_BUNDLE}}
          echo "✅ Generated: {{.OAPI_CODEGEN_WEATHER_V1_TARGET}}/weather.gen.go"
